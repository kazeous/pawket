services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in Coolify}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in Coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.1-alpine3.24
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    image: pawket-migrate:${SOURCE_COMMIT:?Enable SOURCE_COMMIT in Coolify}
    build:
      context: .
      target: migrate
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Enable SOURCE_COMMIT in Coolify}
    restart: "no"
    exclude_from_hc: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      VN_BUSINESS_CALENDAR_VERSION: ${VN_BUSINESS_CALENDAR_VERSION:?Set VN_BUSINESS_CALENDAR_VERSION in Coolify}
      VN_BUSINESS_HOLIDAYS: ${VN_BUSINESS_HOLIDAYS:?Set VN_BUSINESS_HOLIDAYS in Coolify}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: pawket-web:${SOURCE_COMMIT:?Enable SOURCE_COMMIT in Coolify}
    build:
      context: .
      target: web
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Enable SOURCE_COMMIT in Coolify}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?Set APP_ENV in Coolify}
      APP_REVISION: ${SOURCE_COMMIT:?Enable SOURCE_COMMIT in Coolify}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      VALKEY_URL: ${VALKEY_URL:?Set VALKEY_URL in Coolify}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in Coolify}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in Coolify}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?Set AUTH_TRUSTED_ORIGINS in Coolify}
      BETTER_AUTH_SECRETS: ${BETTER_AUTH_SECRETS:?Set BETTER_AUTH_SECRETS in Coolify}
      PII_ACTIVE_KEY_ID: ${PII_ACTIVE_KEY_ID:?Set PII_ACTIVE_KEY_ID in Coolify}
      PII_KEYRING_JSON: ${PII_KEYRING_JSON:?Set PII_KEYRING_JSON in Coolify}
      PII_LOOKUP_HMAC_KEY: ${PII_LOOKUP_HMAC_KEY:?Set PII_LOOKUP_HMAC_KEY in Coolify}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      SECURITY_EMAIL_ADAPTER: ${SECURITY_EMAIL_ADAPTER:?Set SECURITY_EMAIL_ADAPTER in Coolify}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:?Set BOOTSTRAP_OWNER_EMAIL in Coolify}
      VERIFICATION_DEPOSIT_AMOUNT_VND: ${VERIFICATION_DEPOSIT_AMOUNT_VND:?Set VERIFICATION_DEPOSIT_AMOUNT_VND in Coolify}
      OPERATING_BANK_BIN: ${OPERATING_BANK_BIN:?Set OPERATING_BANK_BIN in Coolify}
      OPERATING_BANK_ACCOUNT_NUMBER: ${OPERATING_BANK_ACCOUNT_NUMBER:?Set OPERATING_BANK_ACCOUNT_NUMBER in Coolify}
      OPERATING_BANK_ACCOUNT_NAME: ${OPERATING_BANK_ACCOUNT_NAME:?Set OPERATING_BANK_ACCOUNT_NAME in Coolify}
      VN_BUSINESS_CALENDAR_VERSION: ${VN_BUSINESS_CALENDAR_VERSION:?Set VN_BUSINESS_CALENDAR_VERSION in Coolify}
      VN_BUSINESS_HOLIDAYS: ${VN_BUSINESS_HOLIDAYS:?Set VN_BUSINESS_HOLIDAYS in Coolify}
      AUTH_USER_ABSOLUTE_TTL_SECONDS: ${AUTH_USER_ABSOLUTE_TTL_SECONDS:?Set AUTH_USER_ABSOLUTE_TTL_SECONDS in Coolify}
      AUTH_USER_IDLE_TTL_SECONDS: ${AUTH_USER_IDLE_TTL_SECONDS:?Set AUTH_USER_IDLE_TTL_SECONDS in Coolify}
      AUTH_OWNER_ABSOLUTE_TTL_SECONDS: ${AUTH_OWNER_ABSOLUTE_TTL_SECONDS:?Set AUTH_OWNER_ABSOLUTE_TTL_SECONDS in Coolify}
      AUTH_OWNER_IDLE_TTL_SECONDS: ${AUTH_OWNER_IDLE_TTL_SECONDS:?Set AUTH_OWNER_IDLE_TTL_SECONDS in Coolify}
      AUTH_MFA_PENDING_TTL_SECONDS: ${AUTH_MFA_PENDING_TTL_SECONDS:?Set AUTH_MFA_PENDING_TTL_SECONDS in Coolify}
      AUTH_PRIMARY_STEP_UP_TTL_SECONDS: ${AUTH_PRIMARY_STEP_UP_TTL_SECONDS:?Set AUTH_PRIMARY_STEP_UP_TTL_SECONDS in Coolify}
      AUTH_OWNER_TOTP_STEP_UP_TTL_SECONDS: ${AUTH_OWNER_TOTP_STEP_UP_TTL_SECONDS:?Set AUTH_OWNER_TOTP_STEP_UP_TTL_SECONDS in Coolify}
      AUTH_TOTP_MAX_FAILED_ATTEMPTS: ${AUTH_TOTP_MAX_FAILED_ATTEMPTS:?Set AUTH_TOTP_MAX_FAILED_ATTEMPTS in Coolify}
      AUTH_TOTP_LOCKOUT_SECONDS: ${AUTH_TOTP_LOCKOUT_SECONDS:?Set AUTH_TOTP_LOCKOUT_SECONDS in Coolify}
      CREATOR_PUBLISHING_MODE: disabled
      PUBLIC_MEDIA_S3_ENDPOINT: ${PUBLIC_MEDIA_S3_ENDPOINT:-}
      PUBLIC_MEDIA_S3_REGION: ${PUBLIC_MEDIA_S3_REGION:-}
      PUBLIC_MEDIA_S3_ACCESS_KEY_ID: ${PUBLIC_MEDIA_S3_ACCESS_KEY_ID:-}
      PUBLIC_MEDIA_S3_SECRET_ACCESS_KEY: ${PUBLIC_MEDIA_S3_SECRET_ACCESS_KEY:-}
      PUBLIC_MEDIA_QUARANTINE_BUCKET: ${PUBLIC_MEDIA_QUARANTINE_BUCKET:-}
      PUBLIC_MEDIA_DERIVATIVE_BUCKET: ${PUBLIC_MEDIA_DERIVATIVE_BUCKET:-}
      PUBLIC_MEDIA_S3_FORCE_PATH_STYLE: ${PUBLIC_MEDIA_S3_FORCE_PATH_STYLE:-false}
      PUBLIC_MEDIA_RETENTION_MODE: report_only
      AUTH_PASSWORD_RESET_TTL_SECONDS: ${AUTH_PASSWORD_RESET_TTL_SECONDS:?Set AUTH_PASSWORD_RESET_TTL_SECONDS in Coolify}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    image: pawket-worker:${SOURCE_COMMIT:?Enable SOURCE_COMMIT in Coolify}
    build:
      context: .
      target: worker
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Enable SOURCE_COMMIT in Coolify}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?Set APP_ENV in Coolify}
      APP_REVISION: ${SOURCE_COMMIT:?Enable SOURCE_COMMIT in Coolify}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      VALKEY_URL: ${VALKEY_URL:?Set VALKEY_URL in Coolify}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in Coolify}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in Coolify}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?Set AUTH_TRUSTED_ORIGINS in Coolify}
      BETTER_AUTH_SECRETS: ${BETTER_AUTH_SECRETS:?Set BETTER_AUTH_SECRETS in Coolify}
      PII_ACTIVE_KEY_ID: ${PII_ACTIVE_KEY_ID:?Set PII_ACTIVE_KEY_ID in Coolify}
      PII_KEYRING_JSON: ${PII_KEYRING_JSON:?Set PII_KEYRING_JSON in Coolify}
      PII_LOOKUP_HMAC_KEY: ${PII_LOOKUP_HMAC_KEY:?Set PII_LOOKUP_HMAC_KEY in Coolify}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      SECURITY_EMAIL_ADAPTER: ${SECURITY_EMAIL_ADAPTER:?Set SECURITY_EMAIL_ADAPTER in Coolify}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:?Set BOOTSTRAP_OWNER_EMAIL in Coolify}
      VERIFICATION_DEPOSIT_AMOUNT_VND: ${VERIFICATION_DEPOSIT_AMOUNT_VND:?Set VERIFICATION_DEPOSIT_AMOUNT_VND in Coolify}
      OPERATING_BANK_BIN: ${OPERATING_BANK_BIN:?Set OPERATING_BANK_BIN in Coolify}
      OPERATING_BANK_ACCOUNT_NUMBER: ${OPERATING_BANK_ACCOUNT_NUMBER:?Set OPERATING_BANK_ACCOUNT_NUMBER in Coolify}
      OPERATING_BANK_ACCOUNT_NAME: ${OPERATING_BANK_ACCOUNT_NAME:?Set OPERATING_BANK_ACCOUNT_NAME in Coolify}
      VN_BUSINESS_CALENDAR_VERSION: ${VN_BUSINESS_CALENDAR_VERSION:?Set VN_BUSINESS_CALENDAR_VERSION in Coolify}
      VN_BUSINESS_HOLIDAYS: ${VN_BUSINESS_HOLIDAYS:?Set VN_BUSINESS_HOLIDAYS in Coolify}
      AUTH_USER_ABSOLUTE_TTL_SECONDS: ${AUTH_USER_ABSOLUTE_TTL_SECONDS:?Set AUTH_USER_ABSOLUTE_TTL_SECONDS in Coolify}
      AUTH_USER_IDLE_TTL_SECONDS: ${AUTH_USER_IDLE_TTL_SECONDS:?Set AUTH_USER_IDLE_TTL_SECONDS in Coolify}
      AUTH_OWNER_ABSOLUTE_TTL_SECONDS: ${AUTH_OWNER_ABSOLUTE_TTL_SECONDS:?Set AUTH_OWNER_ABSOLUTE_TTL_SECONDS in Coolify}
      AUTH_OWNER_IDLE_TTL_SECONDS: ${AUTH_OWNER_IDLE_TTL_SECONDS:?Set AUTH_OWNER_IDLE_TTL_SECONDS in Coolify}
      AUTH_MFA_PENDING_TTL_SECONDS: ${AUTH_MFA_PENDING_TTL_SECONDS:?Set AUTH_MFA_PENDING_TTL_SECONDS in Coolify}
      AUTH_PRIMARY_STEP_UP_TTL_SECONDS: ${AUTH_PRIMARY_STEP_UP_TTL_SECONDS:?Set AUTH_PRIMARY_STEP_UP_TTL_SECONDS in Coolify}
      AUTH_OWNER_TOTP_STEP_UP_TTL_SECONDS: ${AUTH_OWNER_TOTP_STEP_UP_TTL_SECONDS:?Set AUTH_OWNER_TOTP_STEP_UP_TTL_SECONDS in Coolify}
      AUTH_TOTP_MAX_FAILED_ATTEMPTS: ${AUTH_TOTP_MAX_FAILED_ATTEMPTS:?Set AUTH_TOTP_MAX_FAILED_ATTEMPTS in Coolify}
      AUTH_TOTP_LOCKOUT_SECONDS: ${AUTH_TOTP_LOCKOUT_SECONDS:?Set AUTH_TOTP_LOCKOUT_SECONDS in Coolify}
      AUTH_PASSWORD_RESET_TTL_SECONDS: ${AUTH_PASSWORD_RESET_TTL_SECONDS:?Set AUTH_PASSWORD_RESET_TTL_SECONDS in Coolify}
      WORKER_TELEMETRY_PORT: 9464
      RETENTION_MODE: ${RETENTION_MODE:-report_only}
      RETENTION_POLICY_VERSION: ${RETENTION_POLICY_VERSION:-}
      RETENTION_APPROVED_AT: ${RETENTION_APPROVED_AT:-}
      RETENTION_ENFORCEMENT_PAUSED: ${RETENTION_ENFORCEMENT_PAUSED:-true}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-100}
      RETENTION_SCAN_INTERVAL_MS: ${RETENTION_SCAN_INTERVAL_MS:-21600000}
      CREATOR_PUBLISHING_MODE: disabled
      PUBLIC_MEDIA_S3_ENDPOINT: ${PUBLIC_MEDIA_S3_ENDPOINT:-}
      PUBLIC_MEDIA_S3_REGION: ${PUBLIC_MEDIA_S3_REGION:-}
      PUBLIC_MEDIA_S3_ACCESS_KEY_ID: ${PUBLIC_MEDIA_S3_ACCESS_KEY_ID:-}
      PUBLIC_MEDIA_S3_SECRET_ACCESS_KEY: ${PUBLIC_MEDIA_S3_SECRET_ACCESS_KEY:-}
      PUBLIC_MEDIA_QUARANTINE_BUCKET: ${PUBLIC_MEDIA_QUARANTINE_BUCKET:-}
      PUBLIC_MEDIA_DERIVATIVE_BUCKET: ${PUBLIC_MEDIA_DERIVATIVE_BUCKET:-}
      PUBLIC_MEDIA_S3_FORCE_PATH_STYLE: ${PUBLIC_MEDIA_S3_FORCE_PATH_STYLE:-false}
      PUBLIC_MEDIA_PROCESSING_CONCURRENCY: ${PUBLIC_MEDIA_PROCESSING_CONCURRENCY:-2}
      PUBLIC_MEDIA_CLEANUP_SCAN_INTERVAL_MS: ${PUBLIC_MEDIA_CLEANUP_SCAN_INTERVAL_MS:-21600000}
      PUBLIC_MEDIA_RETENTION_MODE: report_only
    expose:
      - "9464"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:9464/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
