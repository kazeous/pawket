# Pawket clamd configuration. Mounted read-only at /etc/clamav/clamd.conf in dev, CI and production.
Foreground yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 4
ReadTimeout 300
CommandReadTimeout 30
# Large enough for a 250 MiB submission (Stage B) with margin; uploads above this never reach clamd.
StreamMaxLength 260M
MaxFileSize 260M
MaxScanSize 1024M
MaxRecursion 16
MaxFiles 10000
ScanArchive yes
ScanPDF yes
# Exceeded limits and encrypted content are reported as findings, never skipped.
AlertExceedsMax yes
AlertEncrypted yes
# Keep memory flat on the shared VM: scans wait (and retry) while signatures reload.
ConcurrentDatabaseReload no
