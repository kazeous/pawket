groups:
  - name: pawket-task-8-operations
    rules:
      - alert: PawketRefundDueToday
        expr: pawket_refund_liabilities_total{window="due_today"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Verification-deposit refund is due today
          runbook: ops/runbooks/daily-deposit-reconciliation-and-refunds.md
      - alert: PawketRefundOverdue
        expr: pawket_refund_liabilities_total{window="overdue"} > 0
        labels:
          severity: critical
        annotations:
          summary: Verification-deposit refund is overdue
          runbook: ops/runbooks/overdue-refunds.md
      - alert: PawketRefundAttentionRequired
        expr: pawket_refund_liabilities_total{window="attention_required"} > 0
        labels:
          severity: critical
        annotations:
          summary: Verification-deposit refund requires owner attention
          runbook: ops/runbooks/overdue-refunds.md
      - alert: PawketOutboxBacklogWarning
        expr: pawket_outbox_oldest_age_seconds > 300
        labels:
          severity: warning
        annotations:
          summary: Oldest unpublished outbox event exceeds five minutes
          runbook: ops/runbooks/provider-outage.md
      - alert: PawketOutboxBacklogCritical
        expr: pawket_outbox_oldest_age_seconds > 900
        labels:
          severity: critical
        annotations:
          summary: Oldest unpublished outbox event exceeds fifteen minutes
          runbook: ops/runbooks/provider-outage.md
      - alert: PawketEmailBacklogWarning
        expr: pawket_security_email_oldest_age_seconds > 300
        labels:
          severity: warning
        annotations:
          summary: Oldest pending email exceeds five minutes
          runbook: ops/runbooks/provider-outage.md
      - alert: PawketEmailBacklogCritical
        expr: pawket_security_email_oldest_age_seconds > 900
        labels:
          severity: critical
        annotations:
          summary: Oldest pending email exceeds fifteen minutes
          runbook: ops/runbooks/provider-outage.md
      - alert: PawketEmailAttentionRequired
        expr: pawket_security_email_attention_total > 0
        labels:
          severity: critical
        annotations:
          summary: Email handoff requires operator attention
          runbook: ops/runbooks/provider-outage.md
      - alert: PawketRepeatedAuthenticationAbuse
        expr: sum(increase(pawket_auth_abuse_controls_total[5m])) >= 20
        labels:
          severity: warning
        annotations:
          summary: Authentication abuse controls activated repeatedly
          runbook: ops/runbooks/account-recovery.md
      - alert: PawketWorkerPollStale
        expr: pawket_worker_scan_healthy{scan="outbox"} == 0
        for: 3s
        labels:
          severity: critical
        annotations:
          summary: Worker outbox poll has missed three intervals
          runbook: ops/runbooks/provider-outage.md
      - alert: PawketWorkerPollLastSuccessOverdue
        expr: time() - pawket_worker_last_success_timestamp_seconds{scan="outbox"} > 3
        for: 3s
        labels:
          severity: critical
        annotations:
          summary: Worker outbox poll has stopped completing
          runbook: ops/runbooks/provider-outage.md
      - alert: PawketRefundScanStale
        expr: pawket_worker_scan_healthy{scan="refund"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: Worker refund scan has missed three intervals
          runbook: ops/runbooks/overdue-refunds.md
      - alert: PawketRefundLastSuccessOverdue
        expr: time() - pawket_worker_last_success_timestamp_seconds{scan="refund"} > 180
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Worker refund scan has stopped completing
          runbook: ops/runbooks/overdue-refunds.md
      - alert: PawketRetentionScanStale
        expr: pawket_worker_scan_healthy{scan="retention"} == 0
        for: 18h
        labels:
          severity: critical
        annotations:
          summary: Worker retention scan has remained unhealthy for eighteen hours
          runbook: ops/runbooks/retention-operations.md
      - alert: PawketRetentionLastSuccessOverdue
        expr: time() - pawket_worker_last_success_timestamp_seconds{scan="retention"} > 90000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Worker retention scan has not succeeded within twenty-five hours
          runbook: ops/runbooks/retention-operations.md
      - alert: PawketMigrationFailed
        expr: increase(pawket_migration_runs_total{outcome="failed"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Pawket migration job failed and workloads must remain gated
          runbook: ops/runbooks/release-attestation.md
      - alert: PawketRevisionMismatch
        expr: pawket_revision_match == 0
        labels:
          severity: critical
        annotations:
          summary: Runtime and embedded source revisions do not match
          runbook: ops/runbooks/release-attestation.md
      - alert: PawketPublicMediaProcessingStuck
        expr: pawket_public_media_oldest_pending_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Public media processing has fallen behind by fifteen minutes
          runbook: ops/runbooks/public-media-processing.md
      - alert: PawketPublicMediaTerminalFailures
        expr: increase(pawket_public_media_operations_total{operation="process",outcome="attention_required"}[24h]) > 0
        labels:
          severity: warning
        annotations:
          summary: Public media processing has a terminal failure awaiting review
          runbook: ops/runbooks/public-media-processing.md
      - alert: PawketPublicMediaStorageUnavailable
        expr: pawket_public_media_storage_available == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A public media storage area is unavailable
          runbook: ops/runbooks/public-media-backup-restore.md
      - alert: PawketPublicMediaCleanupFailures
        expr: pawket_worker_scan_healthy{scan="public_media_cleanup"} == 0
        for: 6h5m
        labels:
          severity: warning
        annotations:
          summary: Worker public media cleanup scan has remained unhealthy for one scan interval
          runbook: ops/runbooks/public-media-processing.md
      - alert: PawketPublicContentReportQueueOld
        expr: pawket_public_content_report_oldest_open_seconds > 21600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The public content report queue has an open report older than six hours
          runbook: ops/runbooks/public-content-report-triage.md
      - alert: PawketIncrementThreeWorkerScanUnhealthy
        expr: pawket_worker_scan_healthy{scan="public_media_cleanup"} == 0 or absent(pawket_worker_scan_healthy{scan="public_media_cleanup"}) or (time() - pawket_worker_last_success_timestamp_seconds{scan="public_media_cleanup"} >= 21600)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Worker public media cleanup scan has stopped completing
          runbook: ops/runbooks/creator-publication.md
      - alert: PawketTipExpiryUnhealthy
        expr: (pawket_tip_payments_enabled == 1 and on(job, instance) pawket_worker_scan_healthy{scan="outbox"}) unless on(job, instance) (pawket_worker_scan_healthy{scan="tip_expiry"} == 1 and on(job, instance) (time() - pawket_worker_last_success_timestamp_seconds{scan="tip_expiry"} < 900))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Enabled tip expiry scan is missing unhealthy or stale
          runbook: ops/runbooks/tip-operations.md
      - alert: PawketTipNotificationHandoffFailures
        expr: increase(pawket_tip_operations_total{operation="notification",outcome="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Tip notification handoffs are failing independently of payment state
          runbook: ops/runbooks/tip-operations.md
      - alert: PawketSePayRecoveryUnhealthy
        expr: (pawket_sepay_recovery_enabled == 1) unless on(job, instance) (pawket_worker_scan_healthy{scan="sepay_recovery"} == 1 and on(job, instance) (time() - pawket_worker_last_success_timestamp_seconds{scan="sepay_recovery"} < 1020))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Enabled SePay recovery scan is missing unhealthy or stale
          runbook: ops/runbooks/sepay-reconciliation.md
      - alert: PawketSePayInboxDelayed
        expr: pawket_sepay_inbox_oldest_age_seconds > 900 and on(job, instance) pawket_sepay_recovery_enabled == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SePay pending receipts are older than fifteen minutes
          runbook: ops/runbooks/sepay-reconciliation.md
      - alert: PawketSePayRetryExhausted
        expr: increase(pawket_sepay_operations_total{operation="reconcile",outcome="retry_exhausted"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: SePay reconciliation retries require creator review
          runbook: ops/runbooks/sepay-reconciliation.md
      - alert: PawketCommissionCleanupUnhealthy
        expr: (pawket_commission_cleanup_configured == 1) unless on(job, instance) (pawket_worker_scan_healthy{scan="commission_cleanup"} == 1 and on(job, instance) (time() - pawket_worker_last_success_timestamp_seconds{scan="commission_cleanup"} < 900))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Commission cleanup is missing unhealthy or stale even during payment pauses
          runbook: ops/runbooks/commission-operations.md
      - alert: PawketCommissionFulfillmentUnhealthy
        expr: (pawket_commission_fulfillment_configured == 1) unless on(job, instance) (pawket_worker_scan_healthy{scan="commission_fulfillment"} == 1 and on(job, instance) (time() - pawket_worker_last_success_timestamp_seconds{scan="commission_fulfillment"} < 900))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Commission fulfillment is missing unhealthy or stale
          runbook: ops/runbooks/commission-operations.md
      - alert: PawketCommissionExpiryDelayed
        expr: pawket_commission_expiry_oldest_lag_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Commission closing deadlines are more than fifteen minutes behind
          runbook: ops/runbooks/commission-operations.md
      - alert: PawketCommissionDeliveryOverdue
        expr: pawket_commission_overdue_orders > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Paid commissions have passed their recorded delivery deadline
          runbook: ops/runbooks/commission-operations.md

      - alert: PawketCommissionFileScannerDown
        expr: (pawket_commission_file_scanner_up == 0) and on(job, instance) (pawket_worker_scan_healthy{scan="commission_files"} >= 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The commission file scanner has not answered for fifteen minutes; uploads wait in quarantine
          runbook: ops/runbooks/commission-files.md
      - alert: PawketCommissionFileSignaturesStale
        expr: pawket_commission_file_signature_age_seconds > 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: ClamAV signatures are older than 24 hours; scans are paused until they refresh
          runbook: ops/runbooks/commission-files.md
      - alert: PawketCommissionFileScanBacklog
        expr: pawket_commission_files_oldest_scanning_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A commission file has waited more than an hour for its malware scan
          runbook: ops/runbooks/commission-files.md
      - alert: PawketCommissionFileMaintenanceUnhealthy
        expr: (pawket_worker_scan_healthy{scan="commission_files"} == 0) or (time() - pawket_worker_last_success_timestamp_seconds{scan="commission_files"} >= 900)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Commission file maintenance is failing or stale; expiry, retries and purges are not running
          runbook: ops/runbooks/commission-files.md

      - alert: PawketCommissionRefundOverdue
        expr: pawket_commission_refund_overdue > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: Commission refund obligations are overdue
          runbook: ops/runbooks/overdue-refunds.md
      - alert: PawketCommissionResolutionScanStale
        expr: (pawket_worker_scan_healthy{scan="commission_resolution"} == 0) or (time() - pawket_worker_last_success_timestamp_seconds{scan="commission_resolution"} >= 900)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Commission resolution maintenance is unhealthy or stale
          runbook: ops/runbooks/commission-operations.md
