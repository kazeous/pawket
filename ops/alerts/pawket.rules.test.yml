rule_files:
  - pawket.rules.yml

evaluation_interval: 1s

tests:
  - name: disabled SePay recovery does not alert on missing scan
    interval: 1m
    input_series:
      - series: 'pawket_sepay_recovery_enabled{job="worker",instance="synthetic-worker"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: PawketSePayRecoveryUnhealthy
        exp_alerts: []
  - name: enabled SePay missing recovery alerts after five minutes
    interval: 1m
    input_series:
      - series: 'pawket_sepay_recovery_enabled{job="worker",instance="synthetic-worker"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketSePayRecoveryUnhealthy
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketSePayRecoveryUnhealthy
        exp_alerts:
          - exp_labels:
              job: worker
              instance: synthetic-worker
              severity: critical
            exp_annotations:
              summary: Enabled SePay recovery scan is missing unhealthy or stale
              runbook: ops/runbooks/sepay-reconciliation.md
  - name: SePay pending backlog alerts only after sustained delay
    interval: 1m
    input_series:
      - series: 'pawket_sepay_recovery_enabled{job="worker",instance="synthetic-worker"}'
        values: '1x10'
      - series: 'pawket_sepay_inbox_oldest_age_seconds{job="worker",instance="synthetic-worker"}'
        values: '1200x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketSePayInboxDelayed
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketSePayInboxDelayed
        exp_alerts:
          - exp_labels:
              job: worker
              instance: synthetic-worker
              severity: warning
            exp_annotations:
              summary: SePay pending receipts are older than fifteen minutes
              runbook: ops/runbooks/sepay-reconciliation.md
  - name: SePay retry exhaustion alerts independently of activation
    interval: 1m
    input_series:
      - series: 'pawket_sepay_operations_total{operation="reconcile",outcome="retry_exhausted"}'
        values: '0 0 1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: PawketSePayRetryExhausted
        exp_alerts:
          - exp_labels:
              operation: reconcile
              outcome: retry_exhausted
              severity: warning
            exp_annotations:
              summary: SePay reconciliation retries require creator review
              runbook: ops/runbooks/sepay-reconciliation.md
  - name: outbox scan starts unhealthy and clears only after success
    interval: 1s
    input_series:
      - series: 'pawket_worker_scan_healthy{scan="outbox"}'
        values: '0x5 1x2'
    alert_rule_test:
      - eval_time: 2s
        alertname: PawketWorkerPollStale
        exp_alerts: []
      - eval_time: 3s
        alertname: PawketWorkerPollStale
        exp_alerts:
          - exp_labels:
              scan: outbox
              severity: critical
            exp_annotations:
              summary: Worker outbox poll has missed three intervals
              runbook: ops/runbooks/provider-outage.md
      - eval_time: 6s
        alertname: PawketWorkerPollStale
        exp_alerts: []

  - name: outbox last-success age detects a hung earlier phase
    interval: 1s
    input_series:
      - series: 'pawket_worker_scan_healthy{scan="outbox"}'
        values: '1x9'
      - series: 'pawket_worker_last_success_timestamp_seconds{scan="outbox"}'
        values: '0x9'
    alert_rule_test:
      - eval_time: 6s
        alertname: PawketWorkerPollLastSuccessOverdue
        exp_alerts: []
      - eval_time: 7s
        alertname: PawketWorkerPollLastSuccessOverdue
        exp_alerts:
          - exp_labels:
              scan: outbox
              severity: critical
            exp_annotations:
              summary: Worker outbox poll has stopped completing
              runbook: ops/runbooks/provider-outage.md

  - name: refund scan fires on the third interval
    interval: 1m
    input_series:
      - series: 'pawket_worker_scan_healthy{scan="refund"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: PawketRefundScanStale
        exp_alerts: []
      - eval_time: 3m
        alertname: PawketRefundScanStale
        exp_alerts:
          - exp_labels:
              scan: refund
              severity: critical
            exp_annotations:
              summary: Worker refund scan has missed three intervals
              runbook: ops/runbooks/overdue-refunds.md

  - name: refund last-success age detects a hung later poll
    interval: 1m
    input_series:
      - series: 'pawket_worker_scan_healthy{scan="refund"}'
        values: '1x7'
      - series: 'pawket_worker_last_success_timestamp_seconds{scan="refund"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketRefundLastSuccessOverdue
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketRefundLastSuccessOverdue
        exp_alerts:
          - exp_labels:
              scan: refund
              severity: critical
            exp_annotations:
              summary: Worker refund scan has stopped completing
              runbook: ops/runbooks/overdue-refunds.md

  - name: retention scan remains unhealthy for eighteen hours
    interval: 1m
    input_series:
      - series: 'pawket_worker_scan_healthy{scan="retention"}'
        values: '0x1081'
    alert_rule_test:
      - eval_time: 12h
        alertname: PawketRetentionScanStale
        exp_alerts: []
      - eval_time: 18h
        alertname: PawketRetentionScanStale
        exp_alerts:
          - exp_labels:
              scan: retention
              severity: critical
            exp_annotations:
              summary: Worker retention scan has remained unhealthy for eighteen hours
              runbook: ops/runbooks/retention-operations.md

  - name: retention last-success age detects a hung poll with a stale healthy gauge
    interval: 5m
    input_series:
      - series: 'pawket_worker_scan_healthy{scan="retention"}'
        values: '1x314'
      - series: 'pawket_worker_last_success_timestamp_seconds{scan="retention"}'
        values: '0x314'
    alert_rule_test:
      - eval_time: 25h
        alertname: PawketRetentionLastSuccessOverdue
        exp_alerts: []
      - eval_time: 26h
        alertname: PawketRetentionLastSuccessOverdue
        exp_alerts:
          - exp_labels:
              scan: retention
              severity: critical
            exp_annotations:
              summary: Worker retention scan has not succeeded within twenty-five hours
              runbook: ops/runbooks/retention-operations.md

  - name: refund due-today boundary waits five minutes
    interval: 1m
    input_series:
      - series: 'pawket_refund_liabilities_total{window="due_today"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketRefundDueToday
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketRefundDueToday
        exp_alerts:
          - exp_labels:
              window: due_today
              severity: warning
            exp_annotations:
              summary: Verification-deposit refund is due today
              runbook: ops/runbooks/daily-deposit-reconciliation-and-refunds.md

  - name: outbox backlog boundaries are strict
    interval: 1m
    input_series:
      - series: pawket_outbox_oldest_age_seconds
        values: '299 300 301 900 901'
    alert_rule_test:
      - eval_time: 1m
        alertname: PawketOutboxBacklogWarning
        exp_alerts: []
      - eval_time: 2m
        alertname: PawketOutboxBacklogWarning
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Oldest unpublished outbox event exceeds five minutes
              runbook: ops/runbooks/provider-outage.md
      - eval_time: 3m
        alertname: PawketOutboxBacklogCritical
        exp_alerts: []
      - eval_time: 4m
        alertname: PawketOutboxBacklogCritical
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Oldest unpublished outbox event exceeds fifteen minutes
              runbook: ops/runbooks/provider-outage.md

  - name: revision mismatch and immediate refund alerts evaluate
    interval: 1m
    input_series:
      - series: pawket_revision_match
        values: '0'
      - series: 'pawket_refund_liabilities_total{window="overdue"}'
        values: '1'
      - series: 'pawket_refund_liabilities_total{window="attention_required"}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: PawketRevisionMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Runtime and embedded source revisions do not match
              runbook: ops/runbooks/release-attestation.md
      - eval_time: 0m
        alertname: PawketRefundOverdue
        exp_alerts:
          - exp_labels:
              window: overdue
              severity: critical
            exp_annotations:
              summary: Verification-deposit refund is overdue
              runbook: ops/runbooks/overdue-refunds.md
      - eval_time: 0m
        alertname: PawketRefundAttentionRequired
        exp_alerts:
          - exp_labels:
              window: attention_required
              severity: critical
            exp_annotations:
              summary: Verification-deposit refund requires owner attention
              runbook: ops/runbooks/overdue-refunds.md

  - name: public media processing backlog waits five minutes past fifteen
    interval: 1m
    input_series:
      - series: pawket_public_media_oldest_pending_seconds
        values: '901x7'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketPublicMediaProcessingStuck
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketPublicMediaProcessingStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Public media processing has fallen behind by fifteen minutes
              runbook: ops/runbooks/public-media-processing.md

  - name: terminal media failures surface within the review day
    interval: 1h
    input_series:
      - series: 'pawket_public_media_operations_total{operation="process",outcome="attention_required",purpose="showcase",variant="none"}'
        values: '0 0 1x24'
    alert_rule_test:
      - eval_time: 1h
        alertname: PawketPublicMediaTerminalFailures
        exp_alerts: []
      - eval_time: 3h
        alertname: PawketPublicMediaTerminalFailures
        exp_alerts:
          - exp_labels:
              operation: process
              outcome: attention_required
              purpose: showcase
              variant: none
              severity: warning
            exp_annotations:
              summary: Public media processing has a terminal failure awaiting review
              runbook: ops/runbooks/public-media-processing.md

  - name: an unavailable storage area alerts after five minutes
    interval: 1m
    input_series:
      - series: 'pawket_public_media_storage_available{area="derivative"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketPublicMediaStorageUnavailable
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketPublicMediaStorageUnavailable
        exp_alerts:
          - exp_labels:
              area: derivative
              severity: critical
            exp_annotations:
              summary: A public media storage area is unavailable
              runbook: ops/runbooks/public-media-backup-restore.md

  - name: cleanup health tolerates one scan interval plus five minutes
    interval: 5m
    input_series:
      - series: 'pawket_worker_scan_healthy{scan="public_media_cleanup"}'
        values: '0x76'
    alert_rule_test:
      - eval_time: 6h
        alertname: PawketPublicMediaCleanupFailures
        exp_alerts: []
      - eval_time: 6h5m
        alertname: PawketPublicMediaCleanupFailures
        exp_alerts:
          - exp_labels:
              scan: public_media_cleanup
              severity: warning
            exp_annotations:
              summary: Worker public media cleanup scan has remained unhealthy for one scan interval
              runbook: ops/runbooks/public-media-processing.md

  - name: the open report queue alerts past six hours
    interval: 1m
    input_series:
      - series: pawket_public_content_report_oldest_open_seconds
        values: '21601x7'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketPublicContentReportQueueOld
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketPublicContentReportQueueOld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The public content report queue has an open report older than six hours
              runbook: ops/runbooks/public-content-report-triage.md

  - name: worker scan alerts after five minutes before its first success
    interval: 1m
    input_series:
      - series: 'pawket_worker_scan_healthy{scan="public_media_cleanup"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketIncrementThreeWorkerScanUnhealthy
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketIncrementThreeWorkerScanUnhealthy
        exp_alerts:
          - exp_labels:
              scan: public_media_cleanup
              severity: critical
            exp_annotations:
              summary: Worker public media cleanup scan has stopped completing
              runbook: ops/runbooks/creator-publication.md

  - name: disabled tip expiry stays silent without scan telemetry
    interval: 1m
    input_series:
      - series: 'pawket_tip_payments_enabled{job="worker",instance="synthetic-worker"}'
        values: '0x22'
      - series: 'pawket_worker_scan_healthy{scan="outbox",job="worker",instance="synthetic-worker"}'
        values: '1x22'
    alert_rule_test:
      - eval_time: 6m
        alertname: PawketTipExpiryUnhealthy
        exp_alerts: []

  - name: enabled tip expiry missing before first success alerts and recovers
    interval: 1m
    input_series:
      - series: 'pawket_tip_payments_enabled{job="worker",instance="synthetic-worker"}'
        values: '1x22'
      - series: 'pawket_worker_scan_healthy{scan="outbox",job="worker",instance="synthetic-worker"}'
        values: '1x22'
      - series: 'pawket_worker_scan_healthy{scan="tip_expiry",job="worker",instance="synthetic-worker"}'
        values: '_ _ _ _ _ _ 1 1'
      - series: 'pawket_worker_last_success_timestamp_seconds{scan="tip_expiry",job="worker",instance="synthetic-worker"}'
        values: '_ _ _ _ _ _ 360 420'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketTipExpiryUnhealthy
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketTipExpiryUnhealthy
        exp_alerts:
          - exp_labels:
              job: worker
              instance: synthetic-worker
              severity: critical
            exp_annotations:
              summary: Enabled tip expiry scan is missing unhealthy or stale
              runbook: ops/runbooks/tip-operations.md
      - eval_time: 6m
        alertname: PawketTipExpiryUnhealthy
        exp_alerts: []

  - name: enabled unhealthy tip expiry alerts after five minutes
    interval: 1m
    input_series:
      - series: 'pawket_tip_payments_enabled{job="worker",instance="synthetic-worker"}'
        values: '1x22'
      - series: 'pawket_worker_scan_healthy{scan="outbox",job="worker",instance="synthetic-worker"}'
        values: '1x22'
      - series: 'pawket_worker_scan_healthy{scan="tip_expiry",job="worker",instance="synthetic-worker"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketTipExpiryUnhealthy
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketTipExpiryUnhealthy
        exp_alerts:
          - exp_labels:
              job: worker
              instance: synthetic-worker
              severity: critical
            exp_annotations:
              summary: Enabled tip expiry scan is missing unhealthy or stale
              runbook: ops/runbooks/tip-operations.md

  - name: enabled stale tip expiry alerts after maximum scan interval and grace
    interval: 1m
    input_series:
      - series: 'pawket_tip_payments_enabled{job="worker",instance="synthetic-worker"}'
        values: '1x22'
      - series: 'pawket_worker_scan_healthy{scan="outbox",job="worker",instance="synthetic-worker"}'
        values: '1x22'
      - series: 'pawket_worker_scan_healthy{scan="tip_expiry",job="worker",instance="synthetic-worker"}'
        values: '1x22'
      - series: 'pawket_worker_last_success_timestamp_seconds{scan="tip_expiry",job="worker",instance="synthetic-worker"}'
        values: '0x22'
    alert_rule_test:
      - eval_time: 19m
        alertname: PawketTipExpiryUnhealthy
        exp_alerts: []
      - eval_time: 20m
        alertname: PawketTipExpiryUnhealthy
        exp_alerts:
          - exp_labels:
              job: worker
              instance: synthetic-worker
              severity: critical
            exp_annotations:
              summary: Enabled tip expiry scan is missing unhealthy or stale
              runbook: ops/runbooks/tip-operations.md

  - name: tip notification failure alerts independently of disabled payments
    interval: 1m
    input_series:
      - series: pawket_tip_payments_enabled
        values: '0x9'
      - series: 'pawket_tip_operations_total{operation="notification",outcome="failed"}'
        values: '0 0 1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: PawketTipNotificationHandoffFailures
        exp_alerts: []
      - eval_time: 7m
        alertname: PawketTipNotificationHandoffFailures
        exp_alerts:
          - exp_labels:
              operation: notification
              outcome: failed
              severity: warning
            exp_annotations:
              summary: Tip notification handoffs are failing independently of payment state
              runbook: ops/runbooks/tip-operations.md

  - name: missing worker telemetry alerts after five minutes
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 4m
        alertname: PawketIncrementThreeWorkerScanUnhealthy
        exp_alerts: []
      - eval_time: 5m
        alertname: PawketIncrementThreeWorkerScanUnhealthy
        exp_alerts:
          - exp_labels:
              scan: public_media_cleanup
              severity: critical
            exp_annotations:
              summary: Worker public media cleanup scan has stopped completing
              runbook: ops/runbooks/creator-publication.md

  - name: stale success cannot leave a hung scan healthy beyond one interval plus five minutes
    interval: 5m
    input_series:
      - series: 'pawket_worker_scan_healthy{scan="public_media_cleanup"}'
        values: '1x75'
      - series: 'pawket_worker_last_success_timestamp_seconds{scan="public_media_cleanup"}'
        values: '0x75'
    alert_rule_test:
      - eval_time: 6h
        alertname: PawketIncrementThreeWorkerScanUnhealthy
        exp_alerts: []
      - eval_time: 6h5m
        alertname: PawketIncrementThreeWorkerScanUnhealthy
        exp_alerts:
          - exp_labels:
              scan: public_media_cleanup
              severity: critical
            exp_annotations:
              summary: Worker public media cleanup scan has stopped completing
              runbook: ops/runbooks/creator-publication.md
