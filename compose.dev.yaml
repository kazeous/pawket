services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: pawket_dev
      POSTGRES_USER: pawket
      POSTGRES_PASSWORD: pawket_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pawket_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawket -d pawket_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  valkey:
    image: valkey/valkey:9.1.1-alpine3.24
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - pawket_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  media-object-store:
    image: adobe/s3mock:5.2.0
    environment:
      initialBuckets: pawket-media-quarantine,pawket-media-derivatives
      retainFilesOnExit: "false"
    ports:
      - "9090:9090"

volumes:
  pawket_postgres_data:
  pawket_valkey_data:
