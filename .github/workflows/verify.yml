name: Verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  APP_ENV: test
  APP_REVISION: ci
  APP_BUILD_REVISION: ci
  SOURCE_COMMIT: 0000000000000000000000000000000000000000
  CREATOR_PUBLISHING_MODE: disabled
  TIP_PAYMENTS_MODE: disabled
  COMMISSION_INTAKE_MODE: disabled
  COMMISSION_PAYMENTS_MODE: disabled
  COMMISSION_FILES_MODE: disabled
  COMMISSION_FULFILLMENT_MODE: disabled
  COMMISSION_FILE_RETENTION_MODE: report_only
  COMMISSION_FILES_S3_ENDPOINT: http://127.0.0.1:9090
  COMMISSION_FILES_S3_REGION: us-east-1
  COMMISSION_FILES_S3_ACCESS_KEY_ID: ci-commission-files-key
  COMMISSION_FILES_S3_SECRET_ACCESS_KEY: ci-commission-files-secret
  COMMISSION_FILES_QUARANTINE_BUCKET: pawket-ci-commission-quarantine
  COMMISSION_FILES_CLEAN_BUCKET: pawket-ci-commission-clean
  COMMISSION_FILES_S3_FORCE_PATH_STYLE: true
  COMMISSION_FILES_CLAMD_HOST: 127.0.0.1
  COMMISSION_FILES_CLAMD_PORT: 3310
  PUBLIC_MEDIA_RETENTION_MODE: report_only
  POSTGRES_DB: pawket_ci
  POSTGRES_USER: pawket
  POSTGRES_PASSWORD: pawket_ci_only
  DATABASE_URL: postgresql://pawket:pawket_ci_only@127.0.0.1:5432/pawket_ci
  VALKEY_URL: redis://127.0.0.1:6379
  TEST_DATABASE_URL: postgresql://pawket:pawket_ci_only@127.0.0.1:5432/pawket_ci
  TEST_VALKEY_URL: redis://127.0.0.1:6379
  PAWKET_BROWSER_DATABASE_ADMIN_URL: postgresql://pawket:pawket_ci_only@127.0.0.1:5432/pawket_ci
  PAWKET_BROWSER_DATABASE_URL: postgresql://pawket:pawket_ci_only@127.0.0.1:5432/pawket_ci_browser
  PAWKET_ALLOW_BROWSER_DATABASE_PORT_5432: 1
  PAWKET_BROWSER_APP_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  PAWKET_PR_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
  PUBLIC_MEDIA_S3_ENDPOINT: http://127.0.0.1:9090
  PUBLIC_MEDIA_S3_REGION: us-east-1
  PUBLIC_MEDIA_S3_ACCESS_KEY_ID: ci-media-access-key
  PUBLIC_MEDIA_S3_SECRET_ACCESS_KEY: ci-media-secret-key
  PUBLIC_MEDIA_QUARANTINE_BUCKET: pawket-ci-media-quarantine
  PUBLIC_MEDIA_DERIVATIVE_BUCKET: pawket-ci-media-derivatives
  PUBLIC_MEDIA_S3_FORCE_PATH_STYLE: true
  METRICS_TOKEN: 01234567890123456789012345678901
  APP_BASE_URL: https://pawket.example
  AUTH_TRUSTED_ORIGINS: https://pawket.example
  OIDC_ISSUER: https://idp.example.invalid/application/o/pawket/
  OIDC_CLIENT_ID: pawket-synthetic
  OIDC_PROVIDER_REVISION: synthetic-v1
  OIDC_CLIENT_SECRET: ci-oidc-secret-00000000000000000000000
  OIDC_ACCOUNT_PORTAL_URL: https://idp.example.invalid/if/user/
  PII_ACTIVE_KEY_ID: ci-pii-v1
  PII_KEYRING_JSON: '{"ci-pii-v1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'
  PII_LOOKUP_HMAC_KEY: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
  SECURITY_EMAIL_ADAPTER: disabled
  BOOTSTRAP_OWNER_EMAIL: owner@pawket.example
  VERIFICATION_DEPOSIT_AMOUNT_VND: 1000
  OPERATING_BANK_BIN: "000000"
  OPERATING_BANK_ACCOUNT_NUMBER: "000000"
  OPERATING_BANK_ACCOUNT_NAME: PAWKET CI ONLY
  VN_BUSINESS_CALENDAR_VERSION: vn-ci-v1
  VN_BUSINESS_HOLIDAYS: '["2026-01-01"]'
  AUTH_USER_ABSOLUTE_TTL_SECONDS: 2592000
  AUTH_USER_IDLE_TTL_SECONDS: 604800
  AUTH_OWNER_ABSOLUTE_TTL_SECONDS: 43200
  AUTH_OWNER_IDLE_TTL_SECONDS: 1800
  AUTH_PRIMARY_STEP_UP_TTL_SECONDS: 3600
  AUTH_OWNER_TOTP_STEP_UP_TTL_SECONDS: 3600

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate and base ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PAWKET_BROWSER_APP_REVISION"
          if [ -n "$PAWKET_PR_BASE_REVISION" ]; then
            git merge-base --is-ancestor "$PAWKET_PR_BASE_REVISION" HEAD
          fi

      - name: Set up pnpm 11.22.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify Corepack and pnpm 11.22.0
        shell: bash
        run: test "$(corepack pnpm --version)" = "11.22.0"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Scan full Git history for secrets
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --log-opts=--all --redact

      - name: Review production dependency advisories
        run: corepack pnpm audit --prod --audit-level high

      - name: Validate production license inventory metadata
        run: corepack pnpm licenses:validate

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Unit tests
        run: corepack pnpm test

      - name: Validate Prometheus alert rules
        run: corepack pnpm alerts:validate

      - name: Validate Increment 3 release defaults
        run: corepack pnpm increment-three:validate

      - name: Validate Docker build context
        run: corepack pnpm docker:context:validate

      - name: Validate production Compose
        run: corepack pnpm compose:validate

  integration:
    name: PostgreSQL and Valkey integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: pawket_ci
          POSTGRES_USER: pawket
          POSTGRES_PASSWORD: pawket_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pawket -d pawket_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      s3mock:
        image: adobe/s3mock:5.2.0
        ports:
          - 9090:9090

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate and base ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PAWKET_BROWSER_APP_REVISION"
          if [ -n "$PAWKET_PR_BASE_REVISION" ]; then
            git merge-base --is-ancestor "$PAWKET_PR_BASE_REVISION" HEAD
          fi

      - name: Set up pnpm 11.22.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify Corepack and pnpm 11.22.0
        shell: bash
        run: test "$(corepack pnpm --version)" = "11.22.0"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Start ClamAV for integration tests
        run: >-
          docker run -d --name pawket-ci-clamd -p 127.0.0.1:3310:3310
          -e CLAMAV_NO_FRESHCLAMD=true
          -v "$GITHUB_WORKSPACE/ops/clamav/clamd.conf:/etc/clamav/clamd.conf:ro"
          clamav/clamav:1.5.4-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578

      - name: Wait for ClamAV
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if printf 'PING\n' | nc -w 2 127.0.0.1 3310 | grep -q PONG; then exit 0; fi
            sleep 2
          done
          docker logs pawket-ci-clamd
          exit 1

      - name: Apply integration-test migrations
        run: corepack pnpm --filter @pawket/database db:migrate

      - name: Wait for disposable private S3Mock
        shell: bash
        run: >-
          curl --silent --show-error --retry 60 --retry-all-errors
          --retry-delay 1 --output /dev/null http://127.0.0.1:9090/

      - name: PostgreSQL and Valkey integration tests
        run: corepack pnpm test:integration

  browser:
    name: Application build and browser tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: pawket_ci
          POSTGRES_USER: pawket
          POSTGRES_PASSWORD: pawket_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pawket -d pawket_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      s3mock:
        image: adobe/s3mock:5.2.0
        ports:
          - 9090:9090

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate and base ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PAWKET_BROWSER_APP_REVISION"
          if [ -n "$PAWKET_PR_BASE_REVISION" ]; then
            git merge-base --is-ancestor "$PAWKET_PR_BASE_REVISION" HEAD
          fi

      - name: Set up pnpm 11.22.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify Corepack and pnpm 11.22.0
        shell: bash
        run: test "$(corepack pnpm --version)" = "11.22.0"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # The commission reference-file journeys scan uploads with ClamAV. Start it
      # early so it is ready by the time the Increment 6 suite runs.
      - name: Start ClamAV for commission browser journeys
        run: >-
          docker run -d --name pawket-ci-clamd -p 127.0.0.1:3310:3310
          -e CLAMAV_NO_FRESHCLAMD=true
          -v "$GITHUB_WORKSPACE/ops/clamav/clamd.conf:/etc/clamav/clamd.conf:ro"
          clamav/clamav:1.5.4-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578

      - name: Wait for disposable private S3Mock
        shell: bash
        run: >-
          curl --silent --show-error --retry 60 --retry-all-errors
          --retry-delay 1 --output /dev/null http://127.0.0.1:9090/

      - name: Application build
        run: corepack pnpm build

      - name: Install Chromium for browser tests
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: corepack pnpm test:browser

      - name: Increment 4 disabled and manual-only synthetic browser journeys
        env:
          PAWKET_BROWSER_DATABASE_URL: postgresql://pawket:pawket_ci_only@127.0.0.1:5432/pawket_increment4_tips_browser
        run: corepack pnpm test:browser:increment-four

      - name: Synthetic SSO browser acceptance
        env:
          PAWKET_BROWSER_DATABASE_URL: postgresql://pawket:pawket_ci_only@127.0.0.1:5432/pawket_increment4_tips_browser
        run: corepack pnpm test:browser:auth-sso

      - name: Increment 5 closed-provider and synthetic reconciliation browser journeys
        env:
          PAWKET_BROWSER_DATABASE_URL: postgresql://pawket:pawket_ci_only@127.0.0.1:5432/pawket_increment4_tips_browser
        run: corepack pnpm test:browser:increment-five

      - name: Wait for ClamAV
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if printf 'PING\n' | nc -w 2 127.0.0.1 3310 | grep -q PONG; then exit 0; fi
            sleep 2
          done
          docker logs pawket-ci-clamd
          exit 1

      - name: Increment 6 synthetic commission browser journeys
        env:
          PAWKET_BROWSER_DATABASE_URL: postgresql://pawket:pawket_ci_only@127.0.0.1:5432/pawket_increment6_commissions_browser
        run: corepack pnpm test:browser:increment-six

  arm64-images:
    # Native arm64 runner (free for public repositories): no QEMU emulation.
    name: Production images for linux/arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate and base ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PAWKET_BROWSER_APP_REVISION"
          if [ -n "$PAWKET_PR_BASE_REVISION" ]; then
            git merge-base --is-ancestor "$PAWKET_PR_BASE_REVISION" HEAD
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image for linux/arm64
        run: docker buildx build --build-arg SOURCE_COMMIT="$PAWKET_BROWSER_APP_REVISION" --platform linux/arm64 --target web --output type=cacheonly .

      - name: Build worker image for linux/arm64
        run: docker buildx build --build-arg SOURCE_COMMIT="$PAWKET_BROWSER_APP_REVISION" --platform linux/arm64 --target worker --output type=cacheonly .

      - name: Build migration image for linux/arm64
        run: docker buildx build --build-arg SOURCE_COMMIT="$PAWKET_BROWSER_APP_REVISION" --platform linux/arm64 --target migrate --output type=cacheonly .

  release-gate:
    # The single required result. Fails unless every job above succeeded.
    name: Release gate
    if: ${{ always() }}
    needs: [checks, integration, browser, arm64-images]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do test "$result" = success; done
