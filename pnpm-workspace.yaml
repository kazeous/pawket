packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

injectWorkspacePackages: true

# Dev-only esbuild advisories that the dependents' own ranges cannot reach:
# drizzle-kit's @esbuild-kit loader pins ~0.18.20 (GHSA-67mh-4wv8-2f99) and
# tsup 8.5.1 pins ^0.27.0 (GHSA-g7r4-m6w7-qqqr). Remove once upstream moves.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  'tsup>esbuild': 0.28.2

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1121.0'
  - '@aws-sdk/s3-request-presigner@3.1121.0'
